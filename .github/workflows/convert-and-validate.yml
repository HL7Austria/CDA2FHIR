name: Convert and validate test file

on:
  pull_request:
    branches: [ myhealtheu, myhealtheu-dev ]

jobs:
  # malac:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Check out repo
  #       uses: actions/checkout@v5

  #     - name: Set up Python
  #       uses: actions/setup-python@v5
  #       with:
  #         python-version: '3.x'

  #     - name: Update pip
  #       run: |
  #         python -m pip install --upgrade pip

  #     - name: Install MaLaC-HD with CDA model
  #       run: pip install -r python-maps/requirements.txt

  #     - name: Run MaLaC-HD
  #       run: malac-hd -m maps/CdaToFhirBundle.4.map -co python-maps/CdaToFhirBundle.4.py

  #     - name: Upload MaLaC-HD output
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: malac-hd-output
  #         path: python-maps/CdaToFhirBundle.4.py

  download-validator:
    runs-on: ubuntu-latest
    steps:
      - name: Download FHIR validator
        uses: Legion2/download-release-action@v2.1.0
        with:
          repository: hapifhir/org.hl7.fhir.core
          tag: 'latest'
          path: .
          file: validator_cli.jar

      - name: Upload FHIR validator artifact
        uses: actions/upload-artifact@v4
        with:
          name: fhir-validator
          path: validator_cli.jar

  convert:
    runs-on: ubuntu-latest
    needs: [malac]
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update pip
        run: |
          python -m pip install --upgrade pip

      - name: Install MaLaC-HD with CDA model
        run: pip install -r python-maps/requirements.txt

      - name: Download MaLaC-HD output
        uses: actions/download-artifact@v4
        with:
          name: malac-hd-output
          path: python-maps/

      - name: Convert test files
        run: python scripts/convert.py

      - name: Upload converted files
        uses: actions/upload-artifact@v4
        with:
          name: fhir-test-files
          path: output/
  
  coverage:
    runs-on: ubuntu-latest
    needs: [malac]
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update pip
        run: |
          python -m pip install --upgrade pip
          pip install coverage

      - name: Install MaLaC-HD with CDA model
        run: pip install -r python-maps/requirements.txt

      - name: Run coverage analysis
        run: python scripts/coverage.py

      - name: Combine coverage reports
        run: |
          python scripts/combine_coverage.py
      
      - name: Upload combined coverage report 
        uses: actions/upload-artifact@v4
        with: 
          name: combined-coverage-report
          path: coverage/
    # - name: display coverage
    #   uses: orgoro/coverage@v3.2
    #   with:
    #     coverageFile: coverage/coverage.xml
    #     token: ${{ secrets.GITHUB_TOKEN }}



  prepare:
    runs-on: ubuntu-latest
    needs: [convert, download-validator]
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download FHIR test files
        uses: actions/download-artifact@v4
        with:
          name: fhir-test-files
          path: output/

      - name: Download IGs and build matrix
        id: set-matrix
        run: python scripts/prepare_validation.py

      - name: Upload IGs
        uses: actions/upload-artifact@v4
        with:
          name: igs
          path: |
            igs/

      - name: Upload FHIR package cache
        uses: actions/upload-artifact@v4
        with:
          name: fhir-package-cache
          path: ~/.fhir/packages/
      
  validate:
    runs-on: ubuntu-latest
    needs: [prepare]
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v5

      - name: Download FHIR validator
        uses: actions/download-artifact@v4
        with:
          name: fhir-validator
          path: .

      - name: Download FHIR test files
        uses: actions/download-artifact@v4
        with:
          name: fhir-test-files
          path: output/

      - name: Download IGs
        uses: actions/download-artifact@v4
        with:
          name: igs
          path: igs/

      - name: Download FHIR package cache
        uses: actions/download-artifact@v4
        with:
          name: fhir-package-cache
          path: ~/.fhir/packages/

      - name: Validate ${{ matrix.directory }}/${{ matrix.basename }} (${{ matrix.fmt }})
        run: |
          python scripts/validate.py \
            --directory ${{ matrix.directory }} \
            --basename ${{ matrix.basename }} \
            --fmt ${{ matrix.fmt }}

      - name: Upload validation results
        uses: actions/upload-artifact@v4
        with:
          name: validation-results-${{ matrix.directory }}-${{ matrix.basename }}-${{ matrix.fmt }}
          path: validation/${{ matrix.directory }}/

  collect:
    runs-on: ubuntu-latest
    needs: [validate, coverage]
    if: always()
    steps:
      - name: Download combined coverage report
        uses: actions/download-artifact@v4
        with:
          name: combined-coverage-report
          path: artifacts/coverage/

      - name: Download FHIR test files
        uses: actions/download-artifact@v4
        with:
          name: fhir-test-files
          path: artifacts/output/

      - name: Download MaLaC-HD output
        uses: actions/download-artifact@v4
        with:
          name: malac-hd-output
          path: artifacts/python-maps/

      - name: Download all validation results
        uses: actions/download-artifact@v4
        with:
          pattern: validation-results-*
          merge-multiple: false
          path: artifacts/validation-raw/

      - name: Restructure validation results
        run: |
          mkdir -p artifacts/validation
          for dir in artifacts/validation-raw/*/; do
            # artifact name pattern: validation-results-{directory}-{basename}
            folder_name=$(basename "$dir")
            # extract the directory part (e.g. "lab", "eimpf", "emed")
            category=$(echo "$folder_name" | sed 's/^validation-results-//' | cut -d'-' -f1)
            mkdir -p "artifacts/validation/$category"
            cp -r "$dir"* "artifacts/validation/$category/" 2>/dev/null || true
          done
          rm -rf artifacts/validation-raw/

      - name: Upload all artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-artifacts
          path: artifacts/

  validatejobs:
    runs-on: ubuntu-latest
    needs: [validate]            
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Download validation results
        uses: actions/download-artifact@v4
        with:
          pattern: validation-results-*
          merge-multiple: true
          path: validation/

      - name: Validate results
        run: |
          chmod 744 check_validation_result.sh
          ./check_validation_result.sh || exit_code=$?
          exit $exit_code

      - name: Upload validation summary
        if: always()
        uses: actions/upload-artifact@v4
        with: 
          name: validation-summary
          path: final_validation_check.log