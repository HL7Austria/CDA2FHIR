# Workflow to convert the given FML to Python using MaLaC-HD

name: Convert and validate test file

on:
  pull_request:
    branches: [ myhealtheu, myhealtheu-dev ]

jobs:
  convert-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update pip
        run: |
          python -m pip install --upgrade pip
          pip install coverage

      - name: Install MaLaC-HD with CDA model
        run: |
          pip install -r python-maps/requirements.txt

      - name: Run MaLaC-HD
        run: |
          malac-hd -m maps/CdaToFhirBundle.4.map -co python-maps/CdaToFhirBundle.4.py -s

      - name: Download FHIR validator
        uses: Legion2/download-release-action@v2.1.0
        with:
          repository: hapifhir/org.hl7.fhir.core
          tag: 'latest'
          path: .
          file: validator_cli.jar

      - name: Convert & validate test file to FHIR XML and JSON
        run: |
          python scripts/convert_and_validate.py

      - name: coverage
        run: |
          python scripts/combine_coverage.py

      # - name: display coverage
      #   uses: orgoro/coverage@v3.2
      #   with:
      #     coverageFile: coverage/coverage.xml
      #     token: ${{ secrets.GITHUB_TOKEN }}

      # runs before the upload so its report files end up in the artifact;
      # the job is failed afterwards by the "Fail on validation issues" step
      - name: Validate
        id: validate
        continue-on-error: true
        run: |
          chmod 744 check_validation_result.sh
          ./check_validation_result.sh

      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact
          include-hidden-files: true
          path: |
            coverage/
            output/
            validation/
            python-maps/CdaToFhirBundle.4.py

      - name: Fail on validation issues
        if: steps.validate.outcome == 'failure'
        run: exit 20
