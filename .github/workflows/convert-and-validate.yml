# Workflow to convert the given FML to Python using MaLaC-HD

name: Convert and validate test file

on:
  push:
    branches: [ elga-dev ]
  pull_request:
    branches: [ elga, elga-dev ]

jobs:
  convert-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update pip
        run: |
          python -m pip install --upgrade pip
          pip install coverage

      - name: Install MaLaC-HD with CDA model
        run: |
          pip install malac-hd[cda]

      - name: Run MaLaC-HD
        run: |
          malac-hd -m maps/CdaToFhir.4.map -co python-maps/CdaToFhir.4.py

      - name: Download FHIR validator
        uses: Legion2/download-release-action@v2.1.0
        with:
          repository: hapifhir/org.hl7.fhir.core
          tag: 'latest'
          path: .
          file: validator_cli.jar

      - name: Convert & validate test file to FHIR XML and JSON
        run: |
          python scripts/convert_and_validate.py

      - name: coverage
        run: |
          python scripts/combine_coverage.py

      - name: display coverage
        uses: orgoro/coverage@v3.2
        with:
          coverageFile: coverage/coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact
          include-hidden-files: true
          path: |
            coverage/
            output/
            validation/
            python-maps/CdaToFhir.4.py
            htmlcov/

      - name: Validate
        run: |
          chmod 744 check_validation_result.sh
          ./check_validation_result.sh || exit_code=$?
          exit $exit_code
